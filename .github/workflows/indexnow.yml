name: IndexNow
on:
  push:
    branches: [main]
  workflow_dispatch:
jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Wacht tot Netlify klaar is en meld pagina's bij IndexNow
        run: |
          sleep 240
          python3 scripts/indexnow.py || echo "IndexNow mislukt"
